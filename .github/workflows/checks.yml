# Runs the checks of the kit on every push and pull request. Read its result before you rely on a change.
# The website runs its own checks against this kit before each deployment.
# The frozen files in extras/ get no Terraform check: the course command no longer uses them.
name: Kit checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the kit
        uses: actions/checkout@v7

      - name: Shell scripts
        run: shellcheck -x course setup/*.sh labs/*/*.sh lib/*.sh

      - name: PowerShell scripts
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $findings | Format-Table -AutoSize
          if ($findings) { exit 1 }

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: sample-app/go.mod

      - name: Sample app
        working-directory: sample-app
        run: go vet ./... && go test ./...

      - name: Kit rules, versions, parity and names
        run: python3 tools/check-kit.py
