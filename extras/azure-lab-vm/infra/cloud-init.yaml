#cloud-config
# Setup: first-boot configuration of the lab VM.
# Installs the tools that the labs need, clones the kit into ~/aro-k8s-course and puts the course
# command on the PATH. Progress is logged to /var/log/aro-k8s-install.log.
# Terraform replaces __ADMIN_USER__ with the admin user name and __KIT_REPO__ with the clone URL of the
# kit before the VM is created (lab-vm.tf).
# Keep KIND_VERSION, KUBECTL_MINOR and TERRAFORM_VERSION in line with lib/lib.sh.

package_update: true
packages:
  - ca-certificates
  - curl
  - gnupg
  - jq
  - git
  - unzip
  # The chapter 2 validator reads YAML files with it.
  - python3-yaml

write_files:
  # kind clusters with several nodes need more inotify watches than Ubuntu allows by default.
  - path: /etc/sysctl.d/90-kind.conf
    permissions: "0644"
    content: |
      fs.inotify.max_user_watches = 524288
      fs.inotify.max_user_instances = 512

  - path: /usr/local/sbin/aro-k8s-install-tools.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      ADMIN_USER="$1"
      KIT_REPO="$2"
      KIND_VERSION="v0.33.0"
      KUBECTL_MINOR="v1.37"
      TERRAFORM_VERSION="1.17.2"

      export DEBIAN_FRONTEND=noninteractive
      # shellcheck source=/dev/null
      CODENAME="$(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")"
      ARCH="$(dpkg --print-architecture)"

      # Marks this machine as the course lab VM for the lab scripts.
      install -d -m 0755 /etc/aro-k8s
      touch /etc/aro-k8s/lab-vm
      install -d -m 0755 /etc/apt/keyrings

      echo "Adding the Docker apt repository"
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      printf '%s\n' \
        "Types: deb" \
        "URIs: https://download.docker.com/linux/ubuntu" \
        "Suites: ${CODENAME}" \
        "Components: stable" \
        "Architectures: ${ARCH}" \
        "Signed-By: /etc/apt/keyrings/docker.asc" > /etc/apt/sources.list.d/docker.sources

      echo "Adding the Kubernetes apt repository for kubectl ${KUBECTL_MINOR}"
      curl -fsSL "https://pkgs.k8s.io/core:/stable:/${KUBECTL_MINOR}/deb/Release.key" \
        | gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      chmod a+r /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/${KUBECTL_MINOR}/deb/ /" \
        > /etc/apt/sources.list.d/kubernetes.list

      echo "Adding the Azure CLI apt repository"
      curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
        | gpg --dearmor --yes -o /etc/apt/keyrings/microsoft.gpg
      chmod a+r /etc/apt/keyrings/microsoft.gpg
      printf '%s\n' \
        "Types: deb" \
        "URIs: https://packages.microsoft.com/repos/azure-cli/" \
        "Suites: ${CODENAME}" \
        "Components: main" \
        "Architectures: ${ARCH}" \
        "Signed-By: /etc/apt/keyrings/microsoft.gpg" > /etc/apt/sources.list.d/azure-cli.sources

      echo "Installing Docker Engine, kubectl and the Azure CLI"
      apt-get update
      apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin kubectl azure-cli
      usermod -aG docker "${ADMIN_USER}"

      echo "Installing kind ${KIND_VERSION} and checking its checksum"
      base_url="https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}"
      curl -fsSLo /tmp/kind "${base_url}/kind-linux-${ARCH}"
      curl -fsSLo /tmp/kind.sha256sum "${base_url}/kind-linux-${ARCH}.sha256sum"
      echo "$(awk '{print $1}' /tmp/kind.sha256sum)  /tmp/kind" | sha256sum -c -
      install -m 0755 /tmp/kind /usr/local/bin/kind
      rm -f /tmp/kind /tmp/kind.sha256sum

      echo "Installing Terraform ${TERRAFORM_VERSION} and checking its checksum"
      tf_url="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
      tf_zip="terraform_${TERRAFORM_VERSION}_linux_${ARCH}.zip"
      curl -fsSLo "/tmp/${tf_zip}" "${tf_url}/${tf_zip}"
      curl -fsSLo /tmp/terraform.sha256sums "${tf_url}/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
      (cd /tmp && grep " ${tf_zip}\$" terraform.sha256sums | sha256sum -c -)
      unzip -o -q "/tmp/${tf_zip}" terraform -d /usr/local/bin
      chmod 0755 /usr/local/bin/terraform
      rm -f "/tmp/${tf_zip}" /tmp/terraform.sha256sums

      sysctl --system > /dev/null
      install -d -o "${ADMIN_USER}" -g "${ADMIN_USER}" "/home/${ADMIN_USER}/work"

      # The kit: course up checks this clone and copies .env into it. A failed clone does not stop the
      # installation, because course up clones the kit again when it is missing.
      kit_dir="/home/${ADMIN_USER}/aro-k8s-course"
      echo "Cloning the kit from ${KIT_REPO}"
      if [ ! -d "${kit_dir}/.git" ]; then
        sudo -H -u "${ADMIN_USER}" git clone --quiet "${KIT_REPO}" "${kit_dir}" \
          || echo "Could not clone the kit. course up clones it later."
      fi
      # A launcher rather than a link, so that course runs even if Git did not keep its executable bit.
      printf '#!/usr/bin/env bash\nexec bash "%s/course" "$@"\n' "${kit_dir}" > /usr/local/bin/course
      chmod 0755 /usr/local/bin/course

      {
        echo "docker: $(docker --version)"
        echo "kind: $(kind version)"
        echo "kubectl: $(kubectl version --client 2>/dev/null | head -n 1)"
        echo "az: $(az version --query '"azure-cli"' --output tsv)"
        echo "terraform: $(terraform version | head -n 1)"
      } > /etc/aro-k8s/tools-ready
      echo "Lab tools installed"

runcmd:
  - [bash, -c, "/usr/local/sbin/aro-k8s-install-tools.sh __ADMIN_USER__ __KIT_REPO__ >> /var/log/aro-k8s-install.log 2>&1"]
