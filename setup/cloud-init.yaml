#cloud-config
# First start of the course's WSL distribution. course.ps1 up writes this file, with its placeholders filled,
# to %USERPROFILE%\.cloud-init\<distribution>.user-data before it creates the distribution. cloud-init reads it
# once, at the first start.
#   __USER__                 the Linux user of the course, with passwordless sudo and a locked password
#   __KIT_NAME__             the name of the kit, which is also the name of the distribution
#   __KIT_REPO__             the HTTPS URL that the distribution clones the kit from
#   __KIT_REF__              the branch or tag to clone, or nothing for the default branch
#   __INSTALL_TOOLS_B64__    setup/install-tools.sh, base64-encoded so that no byte changes on the way
#   __WSL_ENVIRONMENT_B64__  setup/wsl-environment.sh, base64-encoded
# Progress is logged to /var/log/__KIT_NAME__-install.log.

users:
  - name: __USER__
    gecos: Learner of the course
    groups: [sudo]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: true

write_files:
  - path: /usr/local/sbin/__KIT_NAME__-install-tools.sh
    permissions: "0755"
    encoding: b64
    content: __INSTALL_TOOLS_B64__
  - path: /usr/local/sbin/__KIT_NAME__-environment.sh
    permissions: "0755"
    encoding: b64
    content: __WSL_ENVIRONMENT_B64__
  # WSL logs in as this user from the next start of the distribution.
  - path: /etc/wsl.conf
    append: true
    content: |
      [user]
      default=__USER__

runcmd:
  - [bash, -c, "{ /usr/local/sbin/__KIT_NAME__-install-tools.sh __USER__ && /usr/local/sbin/__KIT_NAME__-environment.sh __USER__ __KIT_NAME__ __KIT_REPO__ __KIT_REF__; } >> /var/log/__KIT_NAME__-install.log 2>&1"]
